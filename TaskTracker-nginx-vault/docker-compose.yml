version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./secrets/localhost+2.pem:/etc/nginx/ssl/fullchain.pem
      - ./secrets/localhost+2-key.pem:/etc/nginx/ssl/privkey.pem
      - ./secrets/.grafana.htpasswd:/etc/nginx/.grafana.htpasswd
      - ./public:/var/www/html/assets:ro
    depends_on:
      - node-server
    networks:
      - monitor-net

  db:
    image: mysql:5.7.16
    container_name: mysql-container
    environment:    
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: my_db
      MYSQL_USER: root

    volumes:
      - mysql-data:/var/lib/mysql
      # - type: bind
      #   source: D:\\best\\xamppja\\tote
      #   target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 3
    networks:
      - monitor-net
    command:
      - --performance_schema=ON

  mysqld_exporter:
    image: prom/mysqld-exporter
    command:
       - --config.my-cnf="/cfg/.my.cnf"
       - --mysqld.username=root:mypassword
       - --mysqld.address=db:3306
       - --collect.perf_schema.eventsstatements
    volumes:
       - "./.my.cnf:/cfg/.my.cnf"
    networks:
       - monitor-net
    depends_on:
      - db
   
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-container
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: mypassword
    networks:
      - monitor-net
    depends_on:
      - db

  redis:
    image: redis:latest
    container_name: redis-container
    volumes:
      - redis-data:/data
    networks:
      - monitor-net

  node-server:
    build:
      context: .
    networks:
      - monitor-net
    depends_on:
      - db
    deploy:
      replicas: 3
    restart: always
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    restart: always
    networks:
      - monitor-net
    
  node-exporter:
    image: prom/node-exporter:latest
    networks:
      - monitor-net
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-container
    environment:
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SERVER_ROOT_URL: "https://toteja.co/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_dataja:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitor-net
    restart: always
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-server
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./vaults/vault.hcl:/vault/config/vault.hcl
      - vault-data:/vault/data
      - ./config/vault-policies:/vault/policies
      - ./vault-script:/vault/scripts
    environment:
      VAULT_LOCAL_CONFIG: /vault/config/vault.hcl
      VAULT_ADDR: http://0.0.0.0:8200
    command: vault server -config=/vault/config/vault.hcl
    networks:
      - monitor-net
    depends_on:
      db:
        condition: service_healthy


  vault-agent:
    image: hashicorp/vault:1.15
    container_name: vault-agent
    depends_on:
      - vault
    volumes:
      - ./vaults/agent.hcl:/etc/vault/agent.hcl
      - ./vaults/file_secrets:/secrets
    command: vault agent -config=/etc/vault/agent.hcl
    networks:
      - monitor-net

networks:
   monitor-net:
     external: true  # บอกให้ใช้ network ที่สร้างไว้แล้ว
     name: monitor-net

volumes:
  redis-data:
  prometheus_data:
  grafana_dataja:
  mysql-data:
  vault-data:  # ต้องกำหนด volume นี้ในระดับ root
