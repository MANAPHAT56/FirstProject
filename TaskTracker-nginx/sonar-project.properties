# Project identification
sonar.projectKey=kuy11
sonar.projectName=kuy
sonar.projectVersion=1.0

# Source and test configuration
sonar.sources=.
sonar.tests=router/test/
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# SonarQube server configuration
sonar.host.url=http://sonarqube:9000
sonar.login=sqp_41f6963e13f35d004252423971a2e2af4ce62829

# Language and file encoding
sonar.sourceEncoding=UTF-8
sonar.language=js

# JavaScript/Node.js specific settings
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
sonar.javascript.node.maxspace=4096

# Exclusions - files/directories to ignore
sonar.exclusions=coverage/**,\
                 grafana_data/**,\
                 **/*.csv,\
                 OpenSSL-Win64/**,\
                 node_modules/**,\
                 newrelic_agent.log,\
                 **/*.min.js,\
                 **/vendor/**,\
                 **/dist/**,\
                 **/build/**,\
                 **/*.json,\
                 **/*.md,\
                 **/*.txt,\
                 **/*.log,\
                 .env*,\
                 Dockerfile*,\
                 docker-compose*

# Test exclusions (files that shouldn't be analyzed as production code)
sonar.test.exclusions=**/*.test.js,\
                      **/*.spec.js,\
                      **/test/**,\
                      **/tests/**,\
                      **/__tests__/**,\
                      **/mock/**,\
                      **/mocks/**

# Coverage exclusions (files to exclude from coverage calculation)
sonar.coverage.exclusions=**/*.test.js,\
                          **/*.spec.js,\
                          **/test/**,\
                          **/tests/**,\
                          **/__tests__/**,\
                          **/mock/**,\
                          **/mocks/**,\
                          **/config/**,\
                          **/*.config.js,\
                          **/migrations/**,\
                          **/seeds/**

# Duplication exclusions
sonar.cpd.exclusions=**/*.test.js,\
                     **/*.spec.js,\
                     **/migrations/**

# Quality gate settings
sonar.qualitygate.wait=true

# Scanner configuration
sonar.scanner.force-deprecated-java-version=true

# Additional JavaScript/Node.js settings
sonar.javascript.environments=node,browser,es6,jest
sonar.javascript.globals=global,process,Buffer,__dirname,__filename,module,require,exports,console

# Security settings (optional - remove sensitive data detection if needed)
sonar.security.hotspots.includeFiles=**/*.js
sonar.security.hotspots.excludeFiles=**/*.test.js,**/test/**

# Issue exclusions (suppress specific rules if needed)
# Example: Exclude TODO comments from analysis
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1135
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js

# Branch analysis (for CI/CD)
# sonar.branch.name=main
# sonar.pullrequest.key=
# sonar.pullrequest.branch=
# sonar.pullrequest.base=main