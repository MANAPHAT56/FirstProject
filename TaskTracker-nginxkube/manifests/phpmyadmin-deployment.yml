
        - name: PMA_USER
          value: root
        - name: PMA_PASSWORD
          value: mypassword
        ports:
        - containerPort: 8070
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin-service
spec:
  selector:
    app: phpmyadmin
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
